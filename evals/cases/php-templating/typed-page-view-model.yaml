- description: php-templating:typed-page-view-model
  prompts:
    - apply-skill
  vars:
    skill: file://../php-templating/SKILL.md
    project_instructions: |
      This Slim 4 application uses native PHP templates. The privacy-policy page
      has document metadata, a shared site header, policy content, and legal
      navigation. Contacts and navigation options have stable structured fields.
    task: |
      Refactor the controller and template input below to use type-safe
      presentation models. A frontend ViewService should return the complete
      page ViewModel. Show the ViewService, page and nested model classes, the
      thin controller's final render call, and how the page template passes
      policy content to a partial.
    code: |
      $templates->render($response, 'privacy-policy.php', [
          'locale' => $locale,
          'pageTitle' => 'Privacy policy',
          'homeUrl' => $homeUrl,
          'operator' => [
              'name' => $operator->name,
              'protectedEmail' => $protectedEmail,
          ],
          'recipients' => $recipients,
          'privacyPolicyUrl' => $privacyPolicyUrl,
      ]);
  assert:
    - type: contains
      value: PrivacyPolicyPageViewModel
    - type: contains
      value: PrivacyPolicyContentViewModel
    - type: contains
      value: PrivacyPolicyContactViewModel
    - type: contains
      value: PrivacyPolicyRecipientViewModel
    - type: contains
      value: PrivacyPolicyViewService
    - type: regex
      value: 'function\s+fetchPage\s*\([^)]*Locale[^)]*\)\s*:\s*PrivacyPolicyPageViewModel'
    - type: regex
      value: 'list<PrivacyPolicyRecipientViewModel>'
    - type: regex
      value: '\[''page''\s*=>\s*\$page\]'
    - type: regex
      value: '\$page->content'
    - type: not-regex
      value: 'class\s+\w+(?:ViewData|View)\b'
    - type: llm-rubric
      value: >-
        Pass only if the answer creates an immutable page-specific ViewModel
        structured around semantic page components, uses typed nested ViewModels
        for contacts and recipients instead of associative record shapes, keeps
        arrays only for typed collections and framework variable binding, passes
        the page as ['page' => $page], gives the content ViewModel explicitly to
        the partial, and has a frontend ViewService return the complete page
        ViewModel before the controller invokes the renderer. Fail if the
        controller assembles metadata or page components around a partial service
        result, flattens the page model back into render keys, calls a presentation
        data class View or ViewData, exposes domain/framework objects through a
        ViewModel, or models incidental HTML elements.
  metadata:
    id: php-templating:typed-page-view-model
    skill: php-templating
    kind: apply
