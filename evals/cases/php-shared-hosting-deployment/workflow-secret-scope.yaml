- description: php-shared-hosting-deployment:workflow-secret-scope
  prompts:
    - apply-skill
  vars:
    skill: file://../php-shared-hosting-deployment/SKILL.md
    task: |
      Review this shared-host deployment workflow fragment and recommend concrete security corrections:

      jobs:
        deploy:
          permissions: write-all
          runs-on: ubuntu-latest
          env:
            SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
            APP_SECRET: ${{ secrets.APP_SECRET }}
          steps:
            - uses: actions/checkout@v6
            - uses: vendor/php-setup@v2
            - run: ./deployment/deploy.sh

      The host supports SSH keys and its verified host key is available.
  assert:
    - type: regex
      value: '[Ss]tep[- ]scoped|specific step|deployment step'
    - type: regex
      value: 'full(-length)? commit SHA|full SHA'
    - type: regex
      value: '[Mm]inimum|required|least[- ]privilege|contents:\s*read'
    - type: regex
      value: 'SSH key|private key'
    - type: regex
      value: 'host key|known_hosts|StrictHostKeyChecking'
    - type: llm-rubric
      value: 'Pass only if the answer replaces write-all with explicit minimum permissions, pins external actions to verified full commit SHAs, removes secrets from job scope and exposes each only to the step that needs it, prefers the supported SSH key over a password, and requires strict checking of the independently verified host key.'
  metadata:
    id: php-shared-hosting-deployment:workflow-secret-scope
    skill: php-shared-hosting-deployment
    kind: apply
