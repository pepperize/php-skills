- description: php-api-endpoints:validation-collaborators
  prompts:
    - apply-skill
  vars:
    skill: file://../php-api-endpoints/SKILL.md
    additional_skill: file://../php-api-endpoints/references/user-endpoint.md
    project_instructions: |
      This Slim API follows the worked User organization. The new Project
      request has one name field. Existing CreateProjectRequestHydrationResultFactory
      checks raw shape/types, trims name once and ignores unknown fields. Its
      create(array $body) returns CreateProjectRequestHydrationResult, whose
      request is ?CreateProjectRequest and errors are list<CreateProjectRequestError>.
      Existing CreateProjectRequestValidator::validate(CreateProjectRequest)
      invokes Symfony constraints and returns the same typed error list.
      ProjectResponseFactory::createValidationProblem(array $errors) accepts
      typed errors and owns their Problem Details serialization. The earlier
      parser/protection middleware rejects malformed JSON with 400 and non-object
      JSON with 422, then supplies a stdClass parsed body. Invocation already
      binds CreateProjectRequest parameters from class-keyed request attributes.
    task: |
      Implement only CreateProjectRequestValidationMiddleware using the worked
      User pattern and these existing collaborators. State the behavior on
      hydration failure, constraint failure, success and a broken parser guarantee.
      Keep the one-field example structurally consistent with the reference.
  assert:
    - type: regex
      value: 'CreateProjectRequestHydrationResultFactory\s+\$createProjectRequestHydrationResultFactory'
    - type: regex
      value: 'CreateProjectRequestValidator\s+\$createProjectRequestValidator'
    - type: regex
      value: 'ProjectResponseFactory\s+\$projectResponseFactory'
    - type: contains
      value: CreateProjectRequest::class
    - type: contains
      value: LogicException
    - type: llm-rubric
      value: 'Pass only if middleware coordinates the three provided collaborators: cast the guaranteed stdClass body to an array, call the hydration-result factory, short-circuit its typed errors when request is null, call the request validator, short-circuit its typed errors, then attach the same accepted DTO as a class-keyed request attribute and invoke the next handler. A broken stdClass guarantee raises LogicException. Fail for inlining field/type checks, trimming, DTO construction, direct Symfony validation, violation-to-error mapping, pointer/Problem Details serialization, rejecting unknown fields, treating the broken parser guarantee as another 422 branch, or invoking downstream work after a failure. Preserve this split because the task explicitly requires these existing collaborators; do not claim that every new one-field endpoint requires the same classes.'
  metadata:
    id: php-api-endpoints:validation-collaborators
    skill: php-api-endpoints
    kind: apply
