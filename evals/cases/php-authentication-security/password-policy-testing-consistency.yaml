- description: php-authentication-security:unicode-password-testing-consistency
  prompts:
    - apply-skill
  vars:
    skill: file://../php-authentication-security/SKILL.md
    additional_skill: file://../php-testing-style/SKILL.md
    project_instructions: |
      The application uses PHPUnit. Registration, password changes, and resets
      use Argon2id and accept 15 to 128 Unicode characters, including spaces.
      The blocklist and production hashing costs are already configured.
    task: |
      Propose focused regression tests for password acceptance and hashing.
      Include a valid, non-blocklisted password of 64 multibyte Unicode
      characters, the advertised length boundaries, and two valid passwords
      sharing the first 72 bytes but differing afterwards. Explain what each
      test must observe and which collaborators must be real.
  assert:
    - type: regex
      value: '64'
    - type: regex
      value: '72'
    - type: regex
      value: 'Argon2id|PASSWORD_ARGON2ID'
    - type: llm-rubric
      value: 'Pass only if the tests accept a valid non-blocklisted 64-character multibyte password even when its UTF-8 encoding exceeds 72 bytes, cover the 15 and 128 character boundaries including rejection outside them, and use real hashing and verification to prove that each password verifies against its own hash while a password differing only after byte 72 does not verify against the other hash. Fail if the plan mocks away password hashing/verification, uses byte length as the Unicode character count, imposes a bcrypt-style 72-byte cap on new Argon2id passwords, or permits silent truncation.'
  metadata:
    id: php-authentication-security:unicode-password-testing-consistency
    skill: php-authentication-security
    kind: apply

- description: php-authentication-security:legacy-bcrypt-testing-consistency
  prompts:
    - apply-skill
  vars:
    skill: file://../php-authentication-security/SKILL.md
    additional_skill: file://../php-testing-style/SKILL.md
    project_instructions: |
      The application uses PHPUnit. New passwords use Argon2id and accept 15
      to 128 Unicode characters. Existing bcrypt credentials were created
      under an older policy permitting 8 to 128 Unicode characters with no
      byte-length cap. Existing login behavior must remain compatible.
    task: |
      Review this login hash-upgrade implementation and propose focused
      regression tests and the smallest safe correction. Explain how existing
      credentials reach the new-password hashing policy.
    code: |
      public function verifyAndUpgrade(string $password, Account $account): bool
      {
          if (mb_strlen($password, 'UTF-8') < 15 || strlen($password) > 72) {
              return false;
          }

          if (!password_verify($password, $account->passwordHash())) {
              return false;
          }

          if (password_needs_rehash($account->passwordHash(), PASSWORD_ARGON2ID)) {
              $account->replacePasswordHash(password_hash($password, PASSWORD_ARGON2ID));
          }

          return true;
      }
  assert:
    - type: regex
      value: '[Bb]crypt|BCRYPT'
    - type: regex
      value: '[Cc]hange|[Rr]eset'
    - type: llm-rubric
      value: 'Pass only if the review removes retroactive new-password length gates from legacy login, preserves valid legacy passwords below 15 characters and beyond 72 bytes, and prevents automatic bcrypt-to-Argon2id rehash for this legacy cohort. Explain that successful bcrypt verification does not establish the suffix beyond byte 72 and cannot recover the original full password. Require an explicit change/reset under the new policy before migration and propose real-hasher regression tests proving login compatibility and absence of replacement-hash writes before that path. Fail if it auto-rehashes the submitted legacy input after verification, binds an arbitrary suffix, or fixes the Unicode policy by rejecting otherwise valid new passwords beyond 72 bytes.'
  metadata:
    id: php-authentication-security:legacy-bcrypt-testing-consistency
    skill: php-authentication-security
    kind: apply
