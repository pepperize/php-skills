- description: php-authentication-security:password-policy-and-hashing
  prompts:
    - apply-skill
  vars:
    skill: file://../php-authentication-security/SKILL.md
    task: |
      Review and replace this password registration policy and storage design.
      State the accepted length and character policy, the hashing and column
      requirements, whether direct bcrypt can meet the new-password policy,
      compatibility for existing bcrypt credentials, and what happens after a
      successful verification when costs change. Include the skill's handling
      for common or compromised passwords.
    code: |
      final class Passwords
      {
          public function register(string $password): string
          {
              $password = trim($password);

              if (strlen($password) < 8
                  || preg_match('/[A-Z]/', $password) !== 1
                  || preg_match('/[0-9]/', $password) !== 1
              ) {
                  throw new InvalidArgumentException('Weak password');
              }

              return password_hash($password, PASSWORD_BCRYPT);
          }
      }

      // schema excerpt: password_hash VARCHAR(60) NOT NULL
  assert:
    - type: regex
      value: '15.{0,100}(Unicode )?characters?|(?:Unicode )?characters?.{0,100}15'
    - type: regex
      value: '([Aa]llow|[Ss]upport).{0,80}64|64.{0,80}([Aa]llow|[Ss]upport)'
    - type: regex
      value: 'spaces|printable Unicode'
    - type: regex
      value: '([Dd]o not|[Mm]ust not|[Nn]ever).{0,80}(trim|case-fold|rewrite)|trim.{0,80}(changes|significant|remove)'
    - type: regex
      value: 'Argon2id|PASSWORD_ARGON2ID'
    - type: regex
      value: '72[- ]byte|72 bytes'
    - type: regex
      value: '255'
    - type: contains
      value: password_needs_rehash
    - type: llm-rubric
      value: 'Pass only if the answer sets a minimum of 15 Unicode characters for new passwords, supports at least 64 characters plus spaces and printable Unicode without trimming or composition rules, and keeps byte caps compatible with that character policy. It must prefer measured Argon2id, reject direct bcrypt for new hashes because of its 72-byte truncation, preserve existing bcrypt login compatibility under a documented migration policy, and require an explicit change/reset before migrating credentials whose legacy policy allowed over 72 bytes. It must include a bounded upper limit, a local or privacy-preserving blocklist, a hash column of at least 255 characters, and password_needs_rehash() with upgrades subject to that migration policy.'
  metadata:
    id: php-authentication-security:password-policy-and-hashing
    skill: php-authentication-security
    kind: apply
