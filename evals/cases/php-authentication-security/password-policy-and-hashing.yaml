- description: php-authentication-security:password-policy-and-hashing
  prompts:
    - apply-skill
  vars:
    skill: file://../php-authentication-security/SKILL.md
    task: |
      Review and replace this password registration policy and storage design.
      State the accepted length and character policy, the hashing and column
      requirements, the bcrypt Unicode boundary if bcrypt remains in use, and
      what happens after a successful verification when costs change.
    code: |
      final class Passwords
      {
          public function register(string $password): string
          {
              $password = trim($password);

              if (strlen($password) < 8
                  || preg_match('/[A-Z]/', $password) !== 1
                  || preg_match('/[0-9]/', $password) !== 1
              ) {
                  throw new InvalidArgumentException('Weak password');
              }

              return password_hash($password, PASSWORD_BCRYPT);
          }
      }

      // schema excerpt: password_hash VARCHAR(60) NOT NULL
  assert:
    - type: regex
      value: '15.{0,100}(Unicode )?characters?|(?:Unicode )?characters?.{0,100}15'
    - type: regex
      value: '([Aa]llow|[Ss]upport).{0,80}64|64.{0,80}([Aa]llow|[Ss]upport)'
    - type: regex
      value: 'spaces|printable Unicode'
    - type: regex
      value: '([Dd]o not|[Mm]ust not|[Nn]ever).{0,80}(trim|case-fold|rewrite)|trim.{0,80}(changes|significant|remove)'
    - type: regex
      value: 'Argon2id|PASSWORD_ARGON2ID'
    - type: regex
      value: '72[- ]byte|72 bytes'
    - type: regex
      value: '255'
    - type: contains
      value: password_needs_rehash
    - type: llm-rubric
      value: 'Pass only if the answer replaces composition rules and trimming with a minimum of 15 Unicode characters, permits at least 64 characters plus spaces and printable Unicode, recommends a bounded upper limit and a local or privacy-preserving common/compromised-password blocklist, prefers measured Argon2id, requires explicit handling of bcrypt''s 72-byte limit when bcrypt is used, sizes the hash column to at least 255 characters, and rehashes after successful verification when password_needs_rehash() says the current hash is stale.'
  metadata:
    id: php-authentication-security:password-policy-and-hashing
    skill: php-authentication-security
    kind: apply
