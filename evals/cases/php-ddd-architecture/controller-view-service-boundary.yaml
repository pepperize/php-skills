- description: php-ddd-architecture:controller-view-service-boundary
  prompts:
    - apply-skill
  vars:
    skill: file://../php-ddd-architecture/SKILL.md
    project_instructions: |
      This project uses Domain-Driven Design. Domain code lives under Domain,
      frontend HTTP code under App/Frontend, and technical adapters under Infrastructure.
    task: |
      Refactor this server-rendered controller so it no longer accesses repositories directly.
      The rendered data must not expose domain objects. Show the resulting controller,
      frontend ViewService, typed content and page ViewModels, shared header and
      legal-navigation collaborators, and final render call. Repository access
      is potentially costly. The ViewService must return the complete page
      ViewModel; the controller should only adapt HTTP input, call the service,
      render its result, and complete the HTTP response.
    code: |
      final class PrivacyPolicyController
      {
          public function __construct(
              private PhpRenderer $templates,
              private LegalOperatorRepository $legalOperatorRepository,
              private ForwardingRecipientRepository $recipientRepository,
          ) {
          }

          public function getPrivacyPolicy(
              ServerRequestInterface $request,
              ResponseInterface $response,
          ): ResponseInterface {
              $operator = $this->legalOperatorRepository->find();

              return $this->templates->render($response, 'privacy-policy.php', [
                  'operator' => $operator,
                  'recipients' => $this->recipientRepository->findAll(),
              ]);
          }
      }
  assert:
    - type: contains
      value: PrivacyPolicyViewService
    - type: contains
      value: PrivacyPolicyContentViewModel
    - type: regex
      value: 'function\s+fetchPage\s*\([^)]*\)\s*:\s*PrivacyPolicyPageViewModel'
    - type: regex
      value: 'private\s+PrivacyPolicyViewService\s+\$\w+'
    - type: contains
      value: PrivacyPolicyPageViewModel
    - type: regex
      value: '\b\w*HeaderViewModelFactory\b'
    - type: contains
      value: LegalNavigationViewModelFactory
    - type: regex
      value: '\[\s*''page''\s*=>\s*\$page\s*,?\s*\]'
    - type: llm-rubric
      value: 'Pass only if repository dependencies and domain-to-view mapping move into a frontend ViewService, the service returns the complete typed PrivacyPolicyPageViewModel containing no domain objects, shared header and legal-navigation ViewModels come from focused presentation collaborators, and the controller only adapts HTTP input, calls fetchPage(), gives the returned page to the renderer, and completes the response. The ViewService may receive typed request-derived values such as Locale and presentation collaborators may use RouteParserInterface, but requests, responses, and renderers must not enter the ViewService. Fail if the controller still depends on a repository, constructs metadata or page-component ViewModels, receives a partial content ViewModel from the service, passes domain entities to the template, flattens the page into render keys, or calls presentation data View or ViewData.'
  metadata:
    id: php-ddd-architecture:controller-view-service-boundary
    skill: php-ddd-architecture
    kind: apply
