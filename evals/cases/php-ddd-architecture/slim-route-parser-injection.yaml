- description: php-ddd-architecture:slim-route-parser-injection
  prompts:
    - apply-skill
  vars:
    skill: file://../php-ddd-architecture/SKILL.md
    project_instructions: |
      This project uses Domain-Driven Design, Slim 4, the PHP-DI Slim bridge,
      and PHP-DI's mutable Container.
    task: |
      Refactor this server-rendered page so URL generation uses constructor
      injection at the frontend presentation collaborator that owns the page
      URLs. The request currently has no purpose other than route-parser lookup.
      The ViewService must return the complete page ViewModel. Show the updated
      controller, ViewService or shared ViewModel factory, application/container
      registration, and a focused PHPUnit test for URL generation. Preserve the
      route name and arguments, and do not introduce a custom URL-generator
      abstraction. Use a concrete typed page ViewModel in the primary
      implementation and its test; do not return an array or present an
      array-based version as the default.
    code: |
      final class HomeController
      {
          public function getHome(
              ServerRequestInterface $request,
              ResponseInterface $response,
              string $locale,
          ): ResponseInterface {
              $routeParser = RouteContext::fromRequest($request)->getRouteParser();
              $homeUrl = $routeParser->urlFor('home', ['locale' => $locale]);

              return $this->templates->render($response, 'home.php', [
                  'homeUrl' => $homeUrl,
              ]);
          }
      }
  assert:
    - type: regex
      value: 'private\s+RouteParserInterface\s+\$routeParser'
    - type: regex
      value: 'function\s+getHome\s*\(\s*ResponseInterface\s+\$response'
    - type: regex
      value: 'function\s+(?:fetch|create)Page\s*\([^)]*\)\s*:\s*\w+(?:Page)?ViewModel'
    - type: contains
      value: RouteParserInterface::class
    - type: contains
      value: getRouteCollector()->getRouteParser()
    - type: contains
      value: createMock(RouteParserInterface::class)
    - type: llm-rubric
      value: 'Pass only if a frontend ViewService or shared ViewModel factory receives Slim RouteParserInterface through its constructor, uses it with route name home and locale argument, and the otherwise-unused request parameter is removed from the controller. The ViewService must return a complete typed page-specific ViewModel, while the controller keeps the response parameter, calls that collaborator once to obtain the page, renders the returned page, and completes the response. Accept fetchPage() or createPage(); repository or external I/O would require fetchPage(), but URL construction alone does not. Infrastructure composition must bind RouteParserInterface once from the application route collector using the existing PHP-DI container. The unit test must mock RouteParserInterface at the presentation collaborator that owns URL generation without constructing a request or RouteContext solely for that purpose. Fail if the controller assembles the page, a custom URL-generator abstraction is introduced, or any route name or argument changes.'
  metadata:
    id: php-ddd-architecture:slim-route-parser-injection
    skill: php-ddd-architecture
    kind: apply
