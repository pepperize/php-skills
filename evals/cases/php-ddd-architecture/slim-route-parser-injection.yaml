- description: php-ddd-architecture:slim-route-parser-injection
  prompts:
    - apply-skill
  vars:
    skill: file://../php-ddd-architecture/SKILL.md
    project_instructions: |
      This project uses Domain-Driven Design, Slim 4, the PHP-DI Slim bridge,
      and PHP-DI's mutable Container.
    task: |
      Refactor this controller so URL generation uses constructor injection.
      The request currently has no purpose other than route-parser lookup.
      Show the updated controller, application/container registration, and a
      focused PHPUnit test for URL generation. Preserve the route name and
      arguments, and do not introduce a custom URL-generator abstraction.
    code: |
      final class HomeController
      {
          public function getHome(
              ServerRequestInterface $request,
              ResponseInterface $response,
              string $locale,
          ): ResponseInterface {
              $routeParser = RouteContext::fromRequest($request)->getRouteParser();
              $homeUrl = $routeParser->urlFor('home', ['locale' => $locale]);

              return $this->templates->render($response, 'home.php', [
                  'homeUrl' => $homeUrl,
              ]);
          }
      }
  assert:
    - type: regex
      value: 'private\s+RouteParserInterface\s+\$routeParser'
    - type: regex
      value: 'function\s+getHome\s*\(\s*ResponseInterface\s+\$response'
    - type: contains
      value: RouteParserInterface::class
    - type: contains
      value: getRouteCollector()->getRouteParser()
    - type: contains
      value: createMock(RouteParserInterface::class)
    - type: llm-rubric
      value: 'Pass only if the controller receives Slim RouteParserInterface through its constructor, uses it with route name home and locale argument, and removes the otherwise-unused request parameter. The response parameter must remain. Infrastructure composition must bind RouteParserInterface once from the application route collector using the existing PHP-DI container. The unit test must mock RouteParserInterface directly without constructing a request or RouteContext solely for URL generation. Fail if a custom URL-generator abstraction is introduced or any route name or argument changes.'
  metadata:
    id: php-ddd-architecture:slim-route-parser-injection
    skill: php-ddd-architecture
    kind: apply
