- description: php-ddd-architecture:form-validation-middleware
  prompts:
    - apply-skill
  vars:
    skill: file://../php-ddd-architecture/SKILL.md
    project_instructions: |
      This project uses Domain-Driven Design. Frontend HTTP code lives under
      App/Frontend and the application uses Slim with PSR-15 middleware.
    task: |
      Refactor this server-rendered contact-form submission so form values are
      created and validated in the project's preferred boundary. The page is
      initially server-rendered and no submission mechanism has been selected.
      Show the resulting middleware, controller action, route registration,
      and explain how failed submissions retain entered values. Invalid forms
      return status 422; valid forms call ContactService. Reuse the application's
      ProblemDetailsResponseFactory for error responses. ContactFormValues has
      a string message property and ContactService::send accepts that string.
    code: |
      final class ContactController
      {
          public function __construct(
              private ContactFormValuesFactory $valuesFactory,
              private ContactFormValidator $validator,
              private ContactPageRenderer $pageRenderer,
              private ContactService $contactService,
              private ContactResponseFactory $responseFactory,
          ) {
          }

          public function postContact(
              ServerRequestInterface $request,
              ResponseInterface $response,
          ): ResponseInterface {
              $parsedBody = $request->getParsedBody();
              $requestBody = is_array($parsedBody) ? $parsedBody : [];
              $values = $this->valuesFactory->create($requestBody);
              $validationResult = $this->validator->validate($values);

              if ($validationResult->hasErrors()) {
                  return $this->pageRenderer->renderForm(
                      $response->withStatus(422),
                      $values,
                      $validationResult,
                  );
              }

              $this->contactService->send($validationResult->message());

              return $this->responseFactory->createSuccess();
          }
      }
  assert:
    - type: contains
      value: ContactFormValidationMiddleware
    - type: regex
      value: 'class\s+ContactFormValidationMiddleware\s+implements\s+MiddlewareInterface'
    - type: contains
      value: withAttribute(ContactFormValues::class
    - type: regex
      value: 'postContact\s*\([^)]*ContactFormValues\s+\$\w+'
    - type: contains
      value: LogicException
    - type: contains
      value: application/problem+json
    - type: regex
      value: 'add\s*\(\s*ContactFormValidationMiddleware::class\s*\)'
    - type: llm-rubric
      value: 'Pass only if conversion and ContactFormValidator invocation move into route-specific PSR-15 middleware, validation failures return 422 application/problem+json without calling the next handler, success attaches typed ContactFormValues and delegates, and the route registers that middleware. The controller must accept typed ContactFormValues as a parameter; infrastructure invocation wiring resolves the class-keyed attribute and treats absence or the wrong type as a LogicException wiring error before container fallback. The controller calls ContactService only after successful validation. The default submission must validate locally and use JavaScript without navigation so entered values remain in the form; actionable Problem Details types or codes select frontend-owned messages and localization rather than displaying server diagnostic text. Fail if server-rendered initial HTML is assumed to require controller-rendered submission errors, a non-JavaScript fallback is added as a requirement, server title/detail or validator messages are displayed, DTO extraction or validation remains in the controller, or field validation is repeated in ContactService or a domain policy. State-dependent business decisions remain with their owning operations.'
  metadata:
    id: php-ddd-architecture:form-validation-middleware
    skill: php-ddd-architecture
    kind: apply

- description: php-ddd-architecture:explicit-html-form-validation
  prompts:
    - apply-skill
  vars:
    skill: file://../php-ddd-architecture/SKILL.md
    project_instructions: |
      This project uses Domain-Driven Design and Slim with PSR-15 middleware.
      Contact submissions must work as ordinary HTML posts without JavaScript.
    task: |
      Show the boundary flow for a contact submission. Use ContactFormValues,
      ContactFormValidationResult, and ContactFormValidationMiddleware. Invalid
      forms must be rendered with status 422 and entered values preserved.
      Valid forms invoke ContactService. Show request attributes, controller
      handling, and middleware registration; keep validation out of the action.
  assert:
    - type: contains
      value: withAttribute(ContactFormValues::class
    - type: contains
      value: withAttribute(ContactFormValidationResult::class
    - type: regex
      value: 'postContact\s*\([^)]*ContactFormValues\s+\$\w+'
    - type: regex
      value: 'postContact\s*\([^)]*ContactFormValidationResult\s+\$\w+'
    - type: contains
      value: LogicException
    - type: regex
      value: 'add\s*\(\s*ContactFormValidationMiddleware::class\s*\)'
    - type: llm-rubric
      value: 'Pass only if the explicit ordinary HTML requirement takes precedence over the JavaScript default. Middleware converts and validates, attaches typed values and validation-result attributes even for invalid submissions, and delegates. The controller accepts both as typed parameters; infrastructure invocation wiring reports missing or wrong types as LogicException wiring errors before container fallback. The controller renders invalid forms with preserved values and status 422, and invokes ContactService only for valid submissions. Fail if JavaScript or JSON Problem Details is made mandatory for this flow or if middleware renders the HTML form.'
  metadata:
    id: php-ddd-architecture:explicit-html-form-validation
    skill: php-ddd-architecture
    kind: apply
