- description: php-agent-instructions:http-endpoint-contract-routing
  prompts:
    - apply-skill
  vars:
    skill: file://../php-agent-instructions/SKILL.md
    additional_skill: file://../php-agent-instructions/assets/php-skill-self-review.md
    task: |
      Produce the marked PHP Skill Self Review block for a project instruction
      file using the authoritative template, including HTTP endpoint contract
      routing. This is only a request for the block; do not install it or change
      project configuration.
  assert:
    - type: contains
      value: php-api-endpoints
    - type: contains
      value: UserDto
    - type: contains
      value: php-readable-code
    - type: contains
      value: '201'
    - type: contains
      value: Location
    - type: llm-rubric
      value: 'Pass only if the marked block routes REST resource implementation to php-api-endpoints and its worked User reference, naming and CRUD vocabulary to php-readable-code, input/browser behavior to php-request-validation, and rendered-page contracts to php-templating. Keep the creation checkpoint: the service maps the persisted entity to a public DTO and the controller delegates 201/member Location/a representation with its identifier and no secrets to a responder. Distinguish REST, rendered pages and explicitly required traditional HTML actions, including a rendered form calling REST. Delegate full mapping, response, validation and exception details to their owners rather than rebuilding a policy catalog in the block. Fail if ownership is omitted, the public creation checkpoint is lost, or REST rules are imposed on every POST.'
  metadata:
    id: php-agent-instructions:http-endpoint-contract-routing
    skill: php-agent-instructions
    kind: apply
