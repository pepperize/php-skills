- description: php-agent-instructions:http-endpoint-contract-routing
  prompts:
    - apply-skill
  vars:
    skill: file://../php-agent-instructions/SKILL.md
    additional_skill: file://../php-agent-instructions/assets/php-skill-self-review.md
    task: |
      Produce the marked PHP Skill Self Review block for a project instruction
      file using the authoritative template, including HTTP endpoint contract
      routing. This is only a request for the block; do not install it or change
      project configuration.
  assert:
    - type: contains
      value: php-api-endpoints
    - type: contains
      value: UserDto
    - type: contains
      value: php-readable-code
    - type: contains
      value: '201'
    - type: contains
      value: Location
    - type: llm-rubric
      value: 'Pass only if the block explicitly distinguishes REST resource endpoints from HTML pages and traditional form actions. REST services keep resource names and CRUD operations; completed resource creation requires a public output DTO mapped from the persisted entity by the service, controller delegation to a response collaborator for 201/member Location/a representation including its identifier without secrets. The block routes API implementation/refactoring to php-api-endpoints and its worked User reference, with attribute validation and direct Doctrine entity mapping only when appropriate to the project. HTML pages retain ViewService/Renderer and explicitly required traditional forms retain capability services, rendered errors and success redirects. A server-rendered form submitting to a REST resource endpoint follows REST rules. Fail if those REST requirements are imposed on every POST or on all application services, or the distinction is omitted.'
  metadata:
    id: php-agent-instructions:http-endpoint-contract-routing
    skill: php-agent-instructions
    kind: apply
