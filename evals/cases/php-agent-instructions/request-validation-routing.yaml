    - type: llm-rubric
      value: 'Pass only if the self-review block routes request DTO hydration, Symfony constraints, validation middleware, Problem Details, and browser submission handling to php-request-validation. It must establish JavaScript-managed forms as the default, preserve inputs and display server errors, and require an explicit project or task requirement for ordinary HTML submissions. Fail if the new skill is omitted or every form is required to have a non-JavaScript fallback.'
  metadata:
    id: php-agent-instructions:request-validation-routing
    skill: php-agent-instructions
    kind: apply
