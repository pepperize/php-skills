name: Build

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Test release preparation and retention
        run: |
          bash tests/Integration/Deployment/release-retention-test.sh
          python3 -B -m unittest discover -s deployment/tests

      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate database migrations
        env:
          APPLICATION_DATABASE_PATH: ${{ runner.temp }}/application.sqlite
        run: composer migrate

      - name: Run tests
        run: composer test

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Create deployment archive
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bash deployment/build.sh "$RUNNER_TEMP/release"
          printf '%s\n' "$SOURCE_COMMIT" > "$RUNNER_TEMP/release/source-commit"
          tar -czf application.tar.gz -C "$RUNNER_TEMP/release" bin bootstrap.php cli-config.php composer.json composer.lock deployment migrations migrations.php public resources src vendor source-commit

      - name: Upload deployment archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: application-${{ github.sha }}
          path: application.tar.gz
          if-no-files-found: error
          retention-days: 14
