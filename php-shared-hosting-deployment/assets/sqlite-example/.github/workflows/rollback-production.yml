name: Roll back production

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Previously approved production release ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shared-hosting-account
  cancel-in-progress: false

jobs:
  verify-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_REF_NAME: ${{ github.ref_name }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}

    steps:
      - name: Validate rollback request
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF_TYPE" != 'branch' || "$RELEASE_REF_NAME" != 'main' ]]; then
            echo 'Run this workflow from the main branch.' >&2
            exit 1
          fi

          if [[ ! "$RELEASE_ID" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9a-f]{12}-[1-9][0-9]*$ ]]; then
            echo 'The rollback release ID is invalid.' >&2
            exit 1
          fi

  rollback:
    needs: verify-request
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://example.com/
    env:
      DEPLOYMENT_NAME: production
      EXPECTED_SMOKE_TEXT: ${{ vars.EXPECTED_SMOKE_TEXT }}
      DEPLOYMENT_URL: https://example.com/
      DEPLOY_PATH: html/example.com
      RELEASE_ID: ${{ inputs.release_id }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_HOST_KEY: ${{ vars.SSH_HOST_KEY }}
      SSH_PORT: 22

    steps:
      - name: Check out workflow release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install password-based SSH client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Activate previously approved release
        id: rollback
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: bash deployment/release-control.sh rollback

      - name: Run production smoke test
        run: |
          bash deployment/check-deployment.sh "$DEPLOYMENT_URL"

      - name: Retain production release pair after rollback
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          ROLLBACK_RELEASE_ID: ${{ steps.rollback.outputs.previous_active_release_id }}
        run: bash deployment/run-release-retention.sh rollback

      - name: Record rollback
        run: |
          {
            echo '### Production rollback passed'
            echo
            echo "- Active release: \`$RELEASE_ID\`"
            echo "- URL: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
